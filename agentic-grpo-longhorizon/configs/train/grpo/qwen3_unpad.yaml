# Performance probe: unpadded dynamic microbatches with equal trajectory weights.
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - qwen3_common
  - _self_

actor_rollout_ref:
  model:
    use_remove_padding: true
  actor:
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 32768
    # Equivalent to token-mean accumulated one trajectory at a time.
    loss_agg_mode: seq-mean-token-mean
