# Shared objective defaults and formal schedule for distillation methods.
actor_rollout_ref:
  actor:
    distillation:
      _target_: verl.workers.config.actor.DistillationConfig
      enabled: true
      rl_coef: 0.0
      coef: 1.0

trainer:
  total_epochs: 20
  total_training_steps: 200
  save_freq: 50
  test_freq: 100
  checkpoint_archive_dir: ${oc.env:CHECKPOINT_ARCHIVE_ROOT}
