# Shared Qwen3 + MiMo vanilla GRPO configuration; evaluation overrides only its mode.
hydra:
  run:
    dir: ${oc.env:RUN_DIR}/hydra

data:
  train_files: ${oc.env:RUN_DIR}/train.parquet
  val_files: ${oc.env:RUN_DIR}/eval.parquet
  train_batch_size: 4
  val_batch_size: 4
  dataloader_num_workers: 2
  filter_overlong_prompts_workers: 2
  max_prompt_length: 8192
  max_response_length: 12288
  return_raw_chat: true
  seed: 42
  tool_config_path: ${oc.env:REPO}/configs/tool_config/tau_bench_airline_tools.yaml
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  model:
    path: ${oc.env:POLICY_MODEL}
    enable_gradient_checkpointing: true
    lora_rank: 16
    lora_alpha: 32
    lora_init_seed: 42
    target_modules: all-linear
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
    override_config:
      attn_implementation: flash_attention_2
  actor:
    fsdp_config:
      optimizer_offload: true
      param_offload: true
      model_dtype: bf16
    optim:
      lr: 5.0e-06
      lr_warmup_steps_ratio: 0.0
    use_kl_loss: false
    entropy_coeff: 0.0
    use_fused_kernels: true
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    checkpoint:
      save_contents: [model, optimizer, extra]
      load_contents: [model, optimizer, extra]
  rollout:
    name: vllm
    mode: async
    agent:
      default_agent_loop: tool_agent
      num_workers: 1
      agent_loop_config_path: ${oc.env:REPO}/configs/interaction_config/tau_bench_agent_loop.yaml
    multi_turn:
      enable: true
      format: hermes
      max_user_turns: 15
      max_assistant_turns: 15
      tool_config_path: ${oc.env:REPO}/configs/tool_config/tau_bench_airline_tools.yaml
      interaction_config_path: ${oc.env:REPO}/configs/interaction_config/tau_bench_airline_mimo.yaml
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    calculate_log_probs: true
    gpu_memory_utilization: 0.5
    free_cache_engine: true
    max_num_seqs: 12
    max_model_len: 24576
    max_num_batched_tokens: 24576
    log_prob_micro_batch_size_per_gpu: 1
    engine_kwargs:
      vllm:
        seed: 42
    val_kwargs:
      n: 8
      temperature: 0.7
      top_p: 0.9
      top_k: -1
      do_sample: true

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.0
  rollout_correction:
    bypass_mode: true

trainer:
  total_epochs: 1
  total_training_steps: 3
  save_freq: 1
  test_freq: -1
  default_local_dir: ${oc.env:RUN_DIR}/checkpoints
  rollout_data_dir: ${oc.env:RUN_DIR}/rollouts
  validation_data_dir: ${oc.env:RUN_DIR}/validation
  logger: [console, file]
  project_name: agentic-grpo-longhorizon
  experiment_name: ${oc.env:EXP_NAME}
  n_gpus_per_node: 1
  nnodes: 1
  val_before_train: false
  val_only: false
  resume_mode: disable

ray_kwargs:
  ray_init:
    num_cpus: 4
    num_gpus: 1
    include_dashboard: false
    _temp_dir: ${oc.env:RAY_TMPDIR}
    object_store_memory: 2147483648
