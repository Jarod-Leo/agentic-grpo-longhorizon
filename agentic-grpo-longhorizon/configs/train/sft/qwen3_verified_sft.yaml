hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - sft_trainer
  - _self_

data:
  train_files: ${oc.env:VERIFIED_SFT_DATA}
  # This is a held-in loss check only; no test task is used for selection.
  val_files: ${oc.env:VERIFIED_SFT_DATA}
  train_batch_size: 4
  micro_batch_size_per_gpu: 1
  train_max_samples: -1
  val_max_samples: 4
  max_length: 24576
  shuffle: true
  seed: 42
  custom_cls:
    path: ${oc.env:REPO}/src/training/verified_sft_dataset.py
    name: VerifiedTokenSFTDataset

model:
  partial_pretrain: ${oc.env:POLICY_MODEL}
  enable_gradient_checkpointing: true
  trust_remote_code: true
  lora_rank: 16
  lora_alpha: 32
  target_modules: all-linear
  strategy: fsdp2
  fsdp_config:
    model_dtype: bf16
    cpu_offload: false
    offload_params: false
    wrap_policy:
      min_num_params: 0

optim:
  lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  lr_warmup_steps_ratio: 0.0
  clip_grad: 1.0
  lr_scheduler: cosine

use_remove_padding: true
ulysses_sequence_parallel_size: 1

trainer:
  default_local_dir: ${oc.env:VERIFIED_SFT_OUTPUT}
  project_name: agentic-grpo-longhorizon
  experiment_name: qwen3_verified_sft
  total_epochs: 2
  total_training_steps: null
  logger: [console]
  seed: 42
  save_freq: -1
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 1
  resume_mode: disable
  max_ckpt_to_keep: 1
  # The experiment consumes the exported PEFT adapter. Optimizer/extra are kept
  # for diagnostics; this short run intentionally has no full-model resume point.
  checkpoint:
    save_contents: [optimizer, extra]
    load_contents: [optimizer, extra]
